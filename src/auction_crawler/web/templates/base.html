<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tài sản đấu giá BĐS{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css?v=1">
</head>
<body>
{% if user %}
<header class="topbar">
  <a class="brand" href="/">◆ Đấu giá BĐS</a>
  <nav>
    <a href="/" class="{{ 'on' if request.url.path == '/' }}">Tài sản</a>
    <a href="/tasks" class="{{ 'on' if request.url.path.startswith('/tasks') }}">Việc của tôi</a>
    {% if user.role == 'admin' %}<a href="/admin/users" class="{{ 'on' if request.url.path.startswith('/admin') }}">Tài khoản</a>{% endif %}
  </nav>
  <div class="me">
    <a href="/account">{{ user.full_name }}</a>
    <form method="post" action="/logout"><button class="link">Đăng xuất</button></form>
  </div>
</header>
{% endif %}
<main class="{% block main_class %}wrap{% endblock %}">
{% block content %}{% endblock %}
</main>
<script src="/static/app.js?v=1"></script>
</body>
</html>
