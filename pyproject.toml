[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auction-crawler"
version = "0.1.0"
description = "Thu thập, phân loại và thống kê tin đăng đấu giá tài sản (dgts.moj.gov.vn, taisancong.vn)"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pydantic>=2.6",
  "sqlalchemy>=2.0",
  "typer>=0.12",
  "rich>=13",
  "pandas>=2.1",
  "openpyxl>=3.1",
  "pyyaml>=6",
  "tenacity>=8.2",
  "apscheduler>=3.10",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.1",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]   # trang render bằng JS + công cụ probe
postgres = ["psycopg[binary]>=3.1"]
ocr = ["pypdf>=4"]            # + hệ thống: tesseract-ocr tesseract-ocr-vie poppler-utils
dev = ["pytest>=8"]

[project.scripts]
auction = "auction_crawler.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"auction_crawler.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
