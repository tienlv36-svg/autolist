db_url: sqlite:///data/auction.db
raw_cache_dir: data/raw          # lưu HTML/JSON gốc để debug & parse lại; để trống để tắt
export_dir: data/exports
log_level: INFO

http:
  timeout: 30
  max_retries: 4
  delay_seconds: 1.5             # khoảng cách tối thiểu giữa 2 request (mỗi nguồn ghi đè trong sources/*.yaml)
  concurrency: 1                 # số luồng tải chi tiết song song
  user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"
  verify_tls: true

crawl:
  max_pages: 50                  # số trang danh sách tối đa mỗi lần chạy
  fetch_detail: true
  stop_when_page_all_seen: true  # chạy tăng dần: dừng khi cả trang đã có trong DB

schedule:                        # dùng với lệnh `auction schedule`
  cron: "0 2 * * *"              # quét tin mới mỗi ngày 1 lần lúc 2:00 (giờ Việt Nam); xong tự sao lưu + báo Telegram
  fill_cron: "10 0,6-22/2 * * *" # lấp dữ liệu còn thiếu (giá, file đính kèm) các giờ còn lại; mỗi lượt ≤ fill_minutes
  fill_minutes: 110
  enrich_limit: 2000             # mỗi lượt lấy chi tiết (giá…) cho tối đa N tin BĐS cũ chưa có chi tiết / nguồn
  history_limit: 500             # mỗi lượt quét lịch sử giá tối đa N tài sản còn hạn đăng ký (0 = tắt)
  run_on_start: false            # true: chạy ngay 1 lượt mỗi khi dịch vụ khởi động
  ocr_limit: 0                   # >0: mỗi lượt OCR giá từ PDF cho N tin taisancong (cần tesseract)
  docs_minutes: 180              # lượt chính 2:00: đọc file đính kèm tối đa N phút (0 = tắt); còn lại để lượt lấp dữ liệu
  docs_max_file_mb: 25           # file đính kèm lớn hơn N MB: không tải, chỉ lưu đường link tới file gốc
  docs_text_only_expired: true   # tài sản đã hết hạn (lấp dữ liệu năm 2026): chỉ giữ chữ đọc được, không giữ file gốc
  docs_compress_minutes: 30      # mỗi lượt nén dần bản scan PDF đã lưu tối đa N phút (cần ghostscript)
  docs_max_disk_pct: 85          # ổ cứng đã dùng >= N% -> dừng tải file đính kèm, báo Telegram
  ocr_max_pages: 8               # OCR tối đa N trang mỗi file scan (dừng sớm khi đã qua đoạn mô tả tài sản)
  docs_workers: 0                # số tin đọc song song; 0 = số nhân CPU (OCR chạy ưu tiên thấp, web vẫn mượt)
  docs_min_days: 2               # ưu tiên tài sản còn hạn đăng ký ≥ N ngày (kịp dùng số liệu); sắp hết hạn đọc sau
