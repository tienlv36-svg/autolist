# Bộ quy tắc phân loại theo từ khoá (không phân biệt dấu/hoa thường, khớp nguyên từ).
# - field_weights: trọng số theo trường dữ liệu cho từng chiều phân loại
# - weight: điểm mỗi từ khoá; exclude: bỏ qua trường nếu chứa; fields: chỉ xét các trường này
# Đã tinh chỉnh trên ~1.100 tin thật (11/2026). Sửa xong: `auction reclassify`, kiểm tra: `auction eval-classify`.
# LƯU Ý: từ khoá được bỏ dấu khi so khớp -> tránh từ ngắn dễ trùng ("bà" -> "ba" = số ba; "sở" -> "sở hữu").
field_weights:
  asset_type: {title: 2, asset_name: 1, official_type: 1.5, asset_types: 1.5, asset_owner: 0, content: 0.3}
  origin:     {title: 1, asset_name: 0.5, official_type: 2, asset_types: 2, asset_owner: 3, content: 0.3}

